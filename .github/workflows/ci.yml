name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  lint-and-type:
    name: Lint and type checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'

      - name: Ruff
        run: ruff check src tests

      - name: MyPy
        run: mypy

  test-matrix:
    name: Tests (${{ matrix.extra }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        extra: [base, torch, keras, gnn]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies (base)
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'

      - name: Install extra dependencies
        if: matrix.extra != 'base'
        run: pip install -e '.[${{ matrix.extra }}]'

      - name: Run tests (base)
        if: matrix.extra == 'base'
        run: pytest -q

      - name: Run tests (torch)
        if: matrix.extra == 'torch'
        run: pytest -q tests/test_torch_models.py tests/test_tensorization_pipeline.py tests/test_imports.py

      - name: Run tests (keras)
        if: matrix.extra == 'keras'
        run: pytest -q tests/test_tensorization_pipeline.py tests/test_imports.py

      - name: Run tests (gnn)
        if: matrix.extra == 'gnn'
        run: pytest -q tests/test_graph_module.py tests/test_imports.py

  package-check:
    name: Packaging build/twine check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install packaging tools
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Build package
        run: python -m build

      - name: Check distributions
        run: twine check dist/*
