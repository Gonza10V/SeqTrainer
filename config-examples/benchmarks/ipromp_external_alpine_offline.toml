[experiment]
name = "ipromp_external_alpine_offline"
task = "bacterial_promoter_prediction"
description = "Offline Alpine iPro-MP E. coli five-fold ensemble on the shared SeqTrainer split."
seed = 42

[dataset]
name = "ep_dnabert2_genomic_order"
format = "csv"
source_accession = "GSE144621"
source_url = "https://www.ncbi.nlm.nih.gov/geo/query/acc.cgi?acc=GSE144621"
version = "EP_DNA_BERT2_genomic_order"
sequence_field = "sequence"
label_field = "label"

[dataset.split_files]
train = "/data/promoter_classification/train_EP_DNA_BERT2_genomic_order.csv"
validation = "/data/promoter_classification/eval_EP_DNA_BERT2_genomic_order.csv"
test = "/data/promoter_classification/test_EP_DNA_BERT2_genomic_order.csv"

[label]
source = "provided_binary"
positive_label = 1
negative_label = 0

[split]
strategy = "predefined"
seed = 42
validation_name = "eval"

[preprocessing]
encoding = "ipromp_fasta_6mer_external"
sequence_length = 300
pad_or_trim = false

[preprocessing.params]
kmer_size = 6
tokenization = "overlapping_6mer"
model_max_length = 128

[model]
family = "ipromp"
name = "ipromp_ecoli_k12_mg1655_official_ensemble"
version = "zenodo-15180139-offline"

[model.params]
adapter_mode = "seqtrainer_offline_fold_ensemble"
species_id = 10
species_name = "Escherichia coli str K-12 substr. MG1655"
kmer_size = 6
token_max_length = 128
fold_checkpoint_names = [
  "10_fold_1.pth",
  "10_fold_2.pth",
  "10_fold_3.pth",
  "10_fold_4.pth",
  "10_fold_5.pth",
]
ensemble_method = "mean_positive_class_probability"
dnabert6_dir = "/models/DNABERT-6"
ipromp_model_dir = "/models/ipromp_ecoli"
mapping_csv = "/work/outputs/benchmarks/ipromp_external_alpine_offline/ipromp_id_mapping.csv"
train_predictions_csv = "/work/external_predictions/train_predictions.csv"
validation_predictions_csv = "/work/external_predictions/validation_predictions.csv"
test_predictions_csv = "/work/external_predictions/test_predictions.csv"
train_metadata_json = "/work/external_predictions/train_metadata.json"
validation_metadata_json = "/work/external_predictions/validation_metadata.json"
test_metadata_json = "/work/external_predictions/test_metadata.json"

[training]
seed = 42
batch_size = 16
max_epochs = 0
learning_rate = 0.0

[training.params]
mode = "official_pretrained_external_inference"
optimizer = "not_applicable"
loss = "not_applicable"

[evaluation]
primary_metric = "mcc"
threshold_strategy = "validation_mcc"
metrics = [
  "accuracy",
  "balanced_accuracy",
  "auroc",
  "auprc",
  "f1",
  "mcc",
  "precision",
  "sensitivity",
  "specificity",
  "confusion_matrix",
]

[outputs]
output_dir = "/work/outputs/benchmarks/ipromp_external_alpine_offline"
save_json = true
save_csv = true
save_predictions = true

[environment]
device = "cuda"
precision = "float32"

[environment.params]
platform = "CU Boulder Alpine"
partition = "aa100"
qos = "gpu-normal"
gpu = "a100-40gb"
offline_execution = true
