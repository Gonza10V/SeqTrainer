[experiment]
name = "prokbert_mini_kaggle_ep_genomic_order"
task = "bacterial_promoter_prediction"
description = "ProkBERT-mini full fine-tuning on the shared promoter benchmark using a Kaggle GPU."
seed = 42

[dataset]
name = "ep_dnabert2_genomic_order"
format = "csv"
source_accession = "GSE144621"
version = "EP_DNA_BERT2_genomic_order"
sequence_field = "sequence"
label_field = "label"

[dataset.split_files]
train = "data/promoter_classification/train_EP_DNA_BERT2_genomic_order.csv"
validation = "data/promoter_classification/eval_EP_DNA_BERT2_genomic_order.csv"
test = "data/promoter_classification/test_EP_DNA_BERT2_genomic_order.csv"

[label]
source = "provided_binary"
positive_label = 1
negative_label = 0

[split]
strategy = "predefined"
seed = 42
validation_name = "eval"

[preprocessing]
encoding = "prokbert_tokenizer"
sequence_length = 300
pad_or_trim = false

[preprocessing.params]
model_max_length = 512
padding = "longest"
truncation = true

[model]
family = "prokbert"
name = "neuralbioinfo/prokbert-mini"
version = "feb2520a43cd9cdb5b3d8477e47209dbcb55d1dc"

[model.params]
revision = "feb2520a43cd9cdb5b3d8477e47209dbcb55d1dc"
tokenizer_revision = "feb2520a43cd9cdb5b3d8477e47209dbcb55d1dc"
prokbert_package_commit = "8670ae92b816cff158a0b85647a8dea122e251eb"
trust_remote_code = true
allow_download = true
mode = "full_finetune"
pooling = "mean"
classifier_dropout = 0.10
freeze_encoder = false
model_license = "CC-BY-NC-4.0"
base_model = "neuralbioinfo/prokbert-mini"
pretraining_task = "masked_language_modeling"
promoter_finetuned_checkpoint_used = false

[training]
seed = 42
batch_size = 16
max_epochs = 3
learning_rate = 0.00002

[training.params]
optimizer = "adamw"
loss = "bce_with_logits"
weight_decay = 0.01
warmup_ratio = 0.10
gradient_accumulation_steps = 2
early_stopping_patience = 1
early_stopping_metric = "validation_mcc"
gradient_checkpointing = true
max_grad_norm = 1.0
resource_profile = "kaggle_gpu_t4"
diagnostics = ["train_loss", "validation_loss", "validation_mcc", "learning_rate"]

[evaluation]
primary_metric = "mcc"
threshold_strategy = "validation_mcc"
metrics = [
  "mcc",
  "auprc",
  "auroc",
  "accuracy",
  "balanced_accuracy",
  "precision",
  "sensitivity",
  "specificity",
  "f1",
  "confusion_matrix",
  "loss",
]

[outputs]
output_dir = "outputs/benchmarks/prokbert_mini_kaggle_ep_genomic_order"
save_json = true
save_csv = true
save_predictions = true

[environment]
device = "auto"
precision = "fp16"

[environment.params]
platform = "Kaggle"
gpu = "NVIDIA T4 or compatible Kaggle GPU"
sequence_length = 300
model_max_length = 512
seed = 42
