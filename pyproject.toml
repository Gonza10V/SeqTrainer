[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "seqtrainer"
version = "0.1.0"
description = "Synthetic biology domain toolkit for SBOL/SynBioHub ML workflows"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
keywords = ["synthetic biology", "sbol", "synbiohub", "machine learning", "dna"]
authors = [
  { name = "Gonzalo Vidal", email = "Gonzalo.VidalPena@colorado.edu" },
  { name = "Sai Wong", email = "sai.wong@sjsu.edu" }
]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]

dependencies = [
  "pandas>=1.5",
  "numpy>=1.24",
  "rdflib>=6.3.2",
  "scikit-learn>=1.3",
  "requests>=2.31",
  "sbol2>=1.4",
]

[project.optional-dependencies]
keras = [
  "tensorflow>=2.12",
]
torch = [
  "torch>=2.2",
  "transformers>=4.30",
]
gnn = [
  "torch>=2.2",
  "torch-geometric>=2.4",
]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.4",
  "mypy>=1.9",
  "build>=1.2",
  "twine>=5.0",
  "types-requests>=2.31",
]

[project.scripts]
seqtrainer = "seqtrainer.cli.main:main"

[project.urls]
Homepage = "https://github.com/SynBioDex/SeqTrainer"
"Bug Tracker" = "https://github.com/SynBioDex/SeqTrainer/issues"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["seqtrainer*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 120
target-version = "py39"
extend-exclude = [
  "src/seqtrainer/_autordf2gml.py",
  "src/seqtrainer/_autordf2gml-tb.py",
  "src/seqtrainer/config-helper.py",
  "src/seqtrainer/pwm.py",
]

[tool.ruff.lint]
select = ["E", "F", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
files = [
  "src/seqtrainer/clients",
  "src/seqtrainer/sparql",
  "src/seqtrainer/data",
  "src/seqtrainer/transforms",
  "src/seqtrainer/graph",
  "src/seqtrainer/models",
  "src/seqtrainer/torch",
  "src/seqtrainer/keras",
  "src/seqtrainer/cli",
  "src/seqtrainer/applications",
  "src/seqtrainer/_deprecation.py",
]
exclude = '(^src/seqtrainer/_autordf2gml(-tb)?\.py$|^src/seqtrainer/config-helper\.py$|^src/seqtrainer/pwm\.py$)'
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
disable_error_code = ["import-untyped"]
